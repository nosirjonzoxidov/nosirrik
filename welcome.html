<!DOCTYPE html>
<html>
<head>
  <title>Welcome</title>
  <style>
    body {
      background: linear-gradient(to right, #74ebd5, #9face6);
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
      padding: 50px;
      margin: 0;
    }

    h1 {
      font-size: 48px;
      color: #4CAF50;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 18px;
      color: white;
      background-color: #4CAF50;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Xush kelibsiz!</h1>
  <p>Siz muvaffaqiyatli tizimga kirdingiz.</p>
  <a href="index.html" class="button">Orqaga qaytish</a>
</body>
</html>
